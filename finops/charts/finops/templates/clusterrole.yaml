apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "finops.fullname" . }}-krr-reader
  labels:
    {{- include "finops.labels" . | nindent 4 }}
rules:
  # KRR이 워크로드 목록 및 리소스 설정값 조회에 필요한 권한
  # (robusta-dev/krr 공식 docs/krr-in-cluster/krr-in-cluster-job.yaml 기준 권한 세트에 맞춤)
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - configmaps
      - services
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
      - replicasets/scale
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  # frontend(mak-app-rollout)처럼 Deployment 대신 Argo Rollout으로 배포된 워크로드를
  # KRR이 읽기 전용으로 조회하는 데 필요한 권한 (KRR v1.29.0부터 Rollout 조회를 지원함).
  - apiGroups: ["argoproj.io"]
    resources:
      - rollouts
      - rollouts/scale
    verbs: ["get", "list", "watch"]
