name: FinOps Apply Resource Recommendation

# alarm 서비스가 Telegram의 "✅ 승인 (Apply)" 버튼 콜백(infra_approve)을 받으면
# FinOps 정책 엔진(finops)에서 조회한 최종 cpu/memory 권장값을 넘겨 이 워크플로우를 호출합니다.
#
# ⚠️ 전제: 이 워크플로우가 실행되는 저장소(기본값 After-mak/mak-argocd-deploy)의 차트마다
#         resources.requests가 저장되는 위치가 다릅니다(finops/mak-app은 최상위 resources,
#         sample-fastapi/sample-worker는 charts/sample-fastapi/values.yaml 안에 컴포넌트별로
#         중첩되어 있음). 아래 "차트별 values.yaml 경로 매핑" 스텝의 case 문에 새로운 워크로드가
#         추가될 때마다 매핑을 추가해야 합니다. 매핑에 없는 이름은 finops/mak-app과 같은 기본
#         구조(최상위 resources.requests)로 시도하고, 그 경로가 실제로 없으면 조용히 아무 효과 없는
#         변경을 "성공"으로 보고하는 대신 명확히 실패합니다.
#         이 파일은 rollback.yaml / rollback-custom.yaml 처럼 GitOps 저장소(mak-argocd-deploy)에도
#         복사되어 있어야 실제로 동작합니다.
#
# ⚠️ 이 저장소(mak-argocd-deploy)의 repo Secret로 다음이 등록되어 있어야 합니다 (admin 권한 필요):
#   - Workflow permissions를 "Read and write permissions"로 설정 (git push용, 필수)
#   - TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (반영 완료/실패를 텔레그램으로 재보고하기 위함, 선택.
#     없으면 git push까지는 정상 동작하고 알림만 조용히 생략됨)
on:
  workflow_dispatch:
    inputs:
      namespace:
        description: '대상 쿠버네티스 네임스페이스'
        required: true
      deployment_name:
        description: '대상 Deployment 이름'
        required: true
      container_name:
        description: '대상 컨테이너 이름(Bank workload는 필수)'
        required: false
        default: ''
      cpu:
        description: '적용할 CPU request (예: 250m)'
        required: true
      memory:
        description: '적용할 Memory request (예: 512Mi)'
        required: true

jobs:
  apply-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4

      - name: 차트별 values.yaml 경로 매핑
        id: map
        env:
          DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name }}
          CONTAINER_NAME: ${{ github.event.inputs.container_name }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
        run: |
          set -euo pipefail

          # namespace/workload/container -> values.yaml의 정확한 requests 경로
          case "$NAMESPACE/$DEPLOYMENT_NAME/$CONTAINER_NAME" in
            sample-fastapi/sample-fastapi/*)
              VALUES_FILE="charts/sample-fastapi/values.yaml"
              RESOURCES_PATH=".fastapi.resources.requests"
              ;;
            sample-fastapi/sample-worker/*)
              VALUES_FILE="charts/sample-fastapi/values.yaml"
              RESOURCES_PATH=".worker.resources.requests"
              ;;
            frontend/mak-app-rollout/mak-container)
              VALUES_FILE="charts/mak-app/values.yaml"
              RESOURCES_PATH=".resources.frontend.requests"
              ;;
            backend/userservice/userservice|backend/contacts/contacts|backend/balancereader/balancereader|backend/ledgerwriter/ledgerwriter|backend/transactionhistory/transactionhistory)
              VALUES_FILE="charts/mak-app/values.yaml"
              RESOURCES_PATH=".resources.${DEPLOYMENT_NAME}.app.requests"
              ;;
            backend/userservice/worker|backend/contacts/worker|backend/balancereader/worker|backend/ledgerwriter/worker|backend/transactionhistory/worker)
              VALUES_FILE="charts/mak-app/values.yaml"
              RESOURCES_PATH=".resources.${DEPLOYMENT_NAME}.worker.requests"
              ;;
            frontend/mak-app-rollout/|backend/userservice/|backend/contacts/|backend/balancereader/|backend/ledgerwriter/|backend/transactionhistory/)
              echo "::error::Bank workload에는 container_name이 필수입니다."
              exit 1
              ;;
            *)
              echo "::error::지원하지 않는 리소스 식별자: ${NAMESPACE}/${DEPLOYMENT_NAME}/${CONTAINER_NAME}"
              exit 1
              ;;
          esac

          echo "values_file=${VALUES_FILE}" >> "$GITHUB_OUTPUT"
          echo "resources_path=${RESOURCES_PATH}" >> "$GITHUB_OUTPUT"

      - name: Update resources.requests in chart values.yaml
        env:
          DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
          CPU: ${{ github.event.inputs.cpu }}
          MEMORY: ${{ github.event.inputs.memory }}
          VALUES_FILE: ${{ steps.map.outputs.values_file }}
          RESOURCES_PATH: ${{ steps.map.outputs.resources_path }}
        run: |
          set -euo pipefail

          if [ ! -f "$VALUES_FILE" ]; then
            echo "::error::${VALUES_FILE} 를 찾을 수 없습니다. '${DEPLOYMENT_NAME}'에 대한 차트 경로 매핑이"
            echo "::error::잘못되었거나, 이 워크플로우 상단의 case 문에 아직 이 워크로드가 등록되지 않았습니다."
            exit 1
          fi

          # 매핑된 경로에 resources.requests.cpu가 실제로 존재하는지 먼저 확인합니다.
          # 없으면 엉뚱한 곳에 새 키를 만들어 "성공"으로 조용히 끝나버리는(실제로는 배포에
          # 아무 영향도 주지 못하는) 상황을 막기 위함입니다.
          if [ "$(yq "${RESOURCES_PATH}.cpu // \"MISSING\"" "$VALUES_FILE")" = "MISSING" ]; then
            echo "::error::${VALUES_FILE}의 ${RESOURCES_PATH}.cpu 경로가 없습니다."
            echo "::error::'${DEPLOYMENT_NAME}'의 실제 차트 구조에 맞게 이 워크플로우의 매핑을 수정한 뒤 다시 실행하세요."
            exit 1
          fi

          yq -i "${RESOURCES_PATH}.cpu = strenv(CPU) | ${RESOURCES_PATH}.memory = strenv(MEMORY)" "$VALUES_FILE"

          echo "=== [${NAMESPACE}/${DEPLOYMENT_NAME}] 수정된 ${VALUES_FILE} (${RESOURCES_PATH}) ==="
          cat "$VALUES_FILE"

      - name: Commit and Push
        env:
          DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
          CPU: ${{ github.event.inputs.cpu }}
          MEMORY: ${{ github.event.inputs.memory }}
          VALUES_FILE: ${{ steps.map.outputs.values_file }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "변경 사항 없음 (이미 반영된 값과 동일), 푸시를 생략합니다."
            exit 0
          fi

          git commit -m "chore(finops): ${NAMESPACE}/${DEPLOYMENT_NAME} 리소스 요청값을 cpu=${CPU}, memory=${MEMORY}로 반영 (KRR 승인)"
          git push origin HEAD

      # alarm의 trigger_github_workflow()는 "실행 요청이 접수됐다"까지만 확인하고, 이 워크플로우가
      # 실제로 끝까지 성공/실패했는지는 모릅니다. 그래서 실제 반영 결과를 워크플로우 스스로 텔레그램에
      # 다시 보고합니다. TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID Secret이 아직 등록 안 되어 있으면
      # (admin 등록 대기 중) 워크플로우를 실패시키지 않고 알림만 조용히 건너뜁니다.
      - name: Telegram 반영 완료 알림
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
          DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name }}
          CPU: ${{ github.event.inputs.cpu }}
          MEMORY: ${{ github.event.inputs.memory }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID Secret이 없어 완료 알림을 건너뜁니다."
            exit 0
          fi

          TEXT=$(printf '✅ [FinOps 반영 완료]\n%s/%s\nCPU: %s / Memory: %s\nGitOps 저장소에 실제로 커밋/푸시되었습니다.' "$NAMESPACE" "$DEPLOYMENT_NAME" "$CPU" "$MEMORY")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

      - name: Telegram 반영 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
          DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name }}
          CPU: ${{ github.event.inputs.cpu }}
          MEMORY: ${{ github.event.inputs.memory }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID Secret이 없어 실패 알림을 건너뜁니다."
            exit 0
          fi

          TEXT=$(printf '🚨 [FinOps 반영 실패]\n%s/%s (cpu=%s, memory=%s)\nGitOps 반영 중 오류가 발생했습니다. 실행 로그를 확인하세요:\n%s' "$NAMESPACE" "$DEPLOYMENT_NAME" "$CPU" "$MEMORY" "$RUN_URL")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"
