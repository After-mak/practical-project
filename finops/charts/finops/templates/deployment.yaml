apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finops.fullname" . }}
  labels:
    {{- include "finops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "finops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finops.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "finops.fullname" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MOCK_INTEGRATION
              value: {{ .Values.env.mockIntegration | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.env.prometheusUrl | quote }}
            - name: CHRONOS_URL
              value: {{ .Values.env.chronosUrl | quote }}
            - name: AUTO_SEND_TELEGRAM
              value: {{ .Values.env.autoSendTelegram | quote }}
            - name: TG_GATEWAY_URL
              value: {{ .Values.env.tgGatewayUrl | default "http://tg-gateway-service.default.svc.cluster.local:8000" | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.env.logFormat | default "text" | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.dbSecretName | default "krr-data-db-app" }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.dbSecretName | default "krr-data-db-app" }}
                  key: password
            - name: KRR_DB_URI
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@{{ .Values.env.dbHost | default "krr-data-db-rw.finops.svc.cluster.local" }}:{{ .Values.env.dbPort | default "5432" }}/{{ .Values.env.dbName | default "krr_logs_db" }}"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "finops.telegramSecretName" . }}
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "finops.telegramSecretName" . }}
                  key: TELEGRAM_CHAT_ID
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
