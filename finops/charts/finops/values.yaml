replicaCount: 1
nodeSelector:
  role: management

image:
  repository: 372666940978.dkr.ecr.ap-northeast-2.amazonaws.com/finops-analyzer
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

env:
  # Set mock mode to false for real KRR execution
  mockIntegration: "false"
  # Prometheus 로컬 retention이 2d로 줄고 Thanos(S3)가 장기 이력을 담당하게 되면서,
  # KRR의 기본 lookback(336h=14일)이 로컬 Prometheus만 보면 대부분 비어버립니다.
  # Thanos Query가 로컬 최근분(사이드카) + S3 과거분(Store Gateway)을 동일 PromQL API로
  # 합쳐서 보여주므로, KRR/Prometheus 조회를 전부 Thanos Query로 돌려 이력 손실을 막습니다.
  prometheusUrl: "http://thanos-query.prometheus.svc.cluster.local:9090"
  chronosUrl: "http://chronos-model.monitoring.svc.cluster.local:8000"
  autoSendTelegram: "true"
  # "text"(기본, 로컬 개발용) 또는 "json"(구조화 로그, CloudWatch/Datadog 파싱용)
  logFormat: "json"
  # KRR Logs 전용 CNPG DB 설정
  dbHost: "krr-data-db-rw.finops.svc.cluster.local"
  dbPort: "5432"
  dbName: "krr_logs_db"
  dbSecretName: "krr-data-db-app"

# 텔레그램 봇 토큰/챗ID는 여기에 평문으로 넣지 않습니다.
# 아래 둘 중 하나를 사용하세요:
#   1) existingSecret에 미리 만들어둔 Secret 이름을 지정 (권장, GitOps로 커밋 가능)
#   2) values-secret.yaml.example을 values-secret.yaml로 복사해 실제 값을 채운 뒤
#      helm install -f values.yaml -f values-secret.yaml 로 배포 (values-secret.yaml은 .gitignore 처리됨)
telegram:
  # krr-telegram-secret: Terraform이 AWS Secrets Manager에서 읽어와 자동 생성하는 Secret
  # (envs/dev/k8s/13-krr-telegram-secret.tf 참고). existingSecret으로 지정해두면 이 차트가
  # 자체 Secret을 만들지 않아 ArgoCD selfHeal이 값을 되돌리는 문제가 없어집니다.
  existingSecret: "krr-telegram-secret"
  botToken: ""
  chatId: ""

cronjob:
  enabled: true
  schedule: "0 3 * * *"  # 매일 새벽 3시 (Cron 표현식: 새벽 3시 0분)
  # KRR이 targetNamespaces를 스캔해 발견하는 모든 워크로드를 /analyze/namespace로 한 번에 전수 분석합니다.
  targetNamespaces: ["sample-fastapi", "frontend", "backend"]
  historyDuration: "336h"

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi
