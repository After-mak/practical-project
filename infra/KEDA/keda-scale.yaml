apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: finops-tg-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tg-gateway-deployment
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
  - type: redis
    metadata:
      # ✅ 팀의 실제 레디스 주소(예: 클러스터 내부 다른 서비스명 또는 외부 호스트:포트)로 변경
      address: "redis-service.default.svc.cluster.local:6379"
      listName: "telegram_webhook_queue"
      listLength: "10"