name: FinOps Apply Resource Recommendation

# alarm 서비스가 Telegram의 "✅ 승인 (Apply)" 버튼 콜백(infra_approve)을 받으면
# FinOps 정책 엔진(finops)에서 조회한 최종 cpu/memory 권장값을 넘겨 이 워크플로우를 호출합니다.
#
# ⚠️ 전제: 이 워크플로우가 실행되는 저장소(기본값 After-mak/mak-argocd-deploy)에
#         charts/<deployment_name>/values.yaml 이 존재하고, 그 안에 resources.requests.cpu /
#         resources.requests.memory 키가 있어야 합니다 (finops 차트 자신의 values.yaml과 동일한 구조).
#         이 파일은 rollback.yaml / rollback-custom.yaml 처럼 GitOps 저장소(mak-argocd-deploy)에도
#         복사되어 있어야 실제로 동작합니다. 대상 차트 구조가 다르면 "Update resources.requests" 스텝의
#         yq 경로를 실제 구조에 맞게 수정하세요.
on:
  workflow_dispatch:
    inputs:
      namespace:
        description: '대상 쿠버네티스 네임스페이스'
        required: true
      deployment_name:
        description: '대상 Deployment 이름 (charts/<deployment_name>/values.yaml 로 매핑됨)'
        required: true
      cpu:
        description: '적용할 CPU request (예: 250m)'
        required: true
      memory:
        description: '적용할 Memory request (예: 512Mi)'
        required: true

jobs:
  apply-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4

      - name: Update resources.requests in chart values.yaml
        env:
          DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
          CPU: ${{ github.event.inputs.cpu }}
          MEMORY: ${{ github.event.inputs.memory }}
        run: |
          set -euo pipefail

          VALUES_FILE="charts/${DEPLOYMENT_NAME}/values.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "::error::${VALUES_FILE} 를 찾을 수 없습니다. FinOps가 리소스를 조정하려는 Deployment는"
            echo "::error::charts/<deployment_name>/values.yaml 구조를 따라야 합니다. 실제 차트 경로가 다르면"
            echo "::error::이 워크플로우의 VALUES_FILE 계산 로직을 대상 저장소 구조에 맞게 수정하세요."
            exit 1
          fi

          yq -i ".resources.requests.cpu = strenv(CPU) | .resources.requests.memory = strenv(MEMORY)" "$VALUES_FILE"

          echo "=== [${NAMESPACE}/${DEPLOYMENT_NAME}] 수정된 ${VALUES_FILE} ==="
          cat "$VALUES_FILE"

      - name: Commit and Push
        env:
          DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name }}
          NAMESPACE: ${{ github.event.inputs.namespace }}
          CPU: ${{ github.event.inputs.cpu }}
          MEMORY: ${{ github.event.inputs.memory }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "charts/${DEPLOYMENT_NAME}/values.yaml"

          if git diff --cached --quiet; then
            echo "변경 사항 없음 (이미 반영된 값과 동일), 푸시를 생략합니다."
            exit 0
          fi

          git commit -m "chore(finops): ${NAMESPACE}/${DEPLOYMENT_NAME} 리소스 요청값을 cpu=${CPU}, memory=${MEMORY}로 반영 (KRR 승인)"
          git push origin HEAD
