apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "finops.fullname" . }}-krr-reader
  labels:
    {{- include "finops.labels" . | nindent 4 }}
rules:
  # KRR이 워크로드 목록 및 리소스 설정값 조회에 필요한 권한
  # (robusta-dev/krr 공식 docs/krr-in-cluster/krr-in-cluster-job.yaml 기준 권한 세트에 맞춤)
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - configmaps
      - services
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
      - replicasets/scale
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  # KRR이 Argo Rollouts 기반 Frontend도 읽기 전용으로 탐색할 수 있어야 합니다.
  - apiGroups: ["argoproj.io"]
    resources:
      - rollouts
      - rollouts/scale
    verbs: ["get", "list", "watch"]
