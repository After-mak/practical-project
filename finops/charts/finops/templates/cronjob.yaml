{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "finops.fullname" . }}-daily-analyzer
  labels:
    {{- include "finops.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "finops.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: finops-analyzer-trigger
              image: curlimages/curl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  echo "Executing daily FinOps analysis at 3:00 AM..."
                  # targetNamespaces 전체를 /analyze/batch 한 번의 호출로 묶어서 전수 분석합니다.
                  # 네임스페이스별로 /analyze/namespace를 따로 호출하면 텔레그램 알림도 네임스페이스
                  # 수만큼 따로 오게 되므로, 배치 엔드포인트로 통합해 상세 리포트 파일 1개 +
                  # 승인/거절 메시지 1개만 발송되도록 합니다.
                  curl -sf --max-time 1800 -X POST "http://{{ include "finops.fullname" $ }}:{{ $.Values.service.port }}/analyze/batch" \
                    -H "Content-Type: application/json" \
                    -d '{"namespaces": [{{- range $i, $ns := .Values.cronjob.targetNamespaces }}{{ if $i }}, {{ end }}"{{ $ns }}"{{- end }}], "history_duration": "{{ .Values.cronjob.historyDuration }}", "send_telegram": true}' \
                    || echo "ERROR: 배치 분석 실패"
{{- end }}
